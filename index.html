<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef6ff">
  <title>VOLTA MASTER</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef6ff}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#eef6ff}
    #loading{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#eef6ff;z-index:10;transition:opacity .25s ease
    }
    .box{
      width:min(92vw,420px);padding:28px;border-radius:22px;background:#fff;
      box-shadow:0 18px 55px rgba(39,92,150,.14);text-align:center;color:#243447
    }
    .logo{
      width:58px;height:58px;margin:0 auto 14px;border-radius:17px;
      display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;
      background:linear-gradient(135deg,#4f86d9,#6650a8)
    }
    h1{font-size:21px;margin:0 0 7px}
    p{font-size:13px;line-height:1.5;margin:0;color:#718096}
    .bar{height:4px;border-radius:99px;background:#e6eef8;margin-top:18px;overflow:hidden}
    .bar:after{
      content:"";display:block;width:40%;height:100%;border-radius:99px;
      background:#5c83cf;animation:load 1.1s infinite ease-in-out
    }
    @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
    .error{display:none;margin-top:16px;text-align:left;font-size:12px;background:#fff4f4;color:#a33;padding:12px;border-radius:12px}
  </style>
</head>
<body>

  <!--
    VOLTA MASTER · CONTENEDOR LIMPIO
    IMPORTANTE:
    1) Publica tu Web App de Google Apps Script.
    2) Copia su URL /exec en APP_URL.
    3) Publica ESTE HTML en un dominio/hosting externo.
       Al entrar por este HTML, el navegador muestra este contenedor,
       no la página directa de Apps Script.
  -->
  <iframe id="appFrame"
          title="VOLTA MASTER"
          allow="geolocation; microphone; camera; autoplay; fullscreen; clipboard-read; clipboard-write"
          allowfullscreen></iframe>

  <div id="loading">
    <div class="box">
      <div class="logo">V</div>
      <h1>VOLTA MASTER</h1>
      <p>Iniciando plataforma operativa…</p>
      <div class="bar"></div>
      <div id="error" class="error"></div>
    </div>
  </div>

  <script>
    /*
      PEGA AQUÍ LA URL DE TU WEB APP:
      Ejemplo:
      const APP_URL = "https://script.google.com/macros/s/XXXXXXXX/exec";
    */
    const APP_URL = "https://script.google.com/macros/s/AKfycbyiBdXUxAEAomFemkVknV-YMkgGNAy3-lVGJ95FkWJoMK-MY9FnO4d8DZtYS5uOP3m3pA/exec";

    const frame = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    function mostrarError(texto){
      error.style.display = "block";
      error.textContent = texto;
    }

    if (!APP_URL || APP_URL.indexOf("PEGA_AQUI") !== -1) {
      mostrarError("Falta configurar APP_URL. Sustituye el texto de APP_URL por la URL /exec de tu Web App de Google Apps Script.");
    } else {
      frame.src = APP_URL;
      frame.addEventListener("load", function(){
        setTimeout(function(){
          loading.style.opacity = "0";
          setTimeout(function(){ loading.style.display = "none"; }, 260);
        }, 250);
      });
    }
  </script>
</body>
</html>
